<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 780" width="1020" height="780" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1020" height="780" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b5651d"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a7440"/>
    </marker>
  </defs>

  <text x="510" y="36" text-anchor="middle" font-size="21" font-weight="bold" fill="#111111">uart-core microarchitecture</text>
  <text x="510" y="58" text-anchor="middle" font-size="13" fill="#555555">one baud generator shared by the transmit and receive datapaths</text>

  <!-- ===================== baud generator ===================== -->
  <rect x="60" y="100" width="210" height="104" rx="6" fill="#eef2f8" stroke="#33455c" stroke-width="2"/>
  <text x="165" y="128" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b2a3a">baud_gen</text>
  <text x="165" y="150" text-anchor="middle" font-size="12" fill="#33455c">16-bit counter</text>
  <text x="165" y="170" text-anchor="middle" font-size="12" fill="#33455c">reload = divisor</text>
  <text x="165" y="192" text-anchor="middle" font-size="11" fill="#666666">divisor = clk / (baud x 16)</text>

  <line x1="18" y1="142" x2="58" y2="142" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="18" y="132" font-size="11.5" fill="#333333">clk</text>
  <line x1="18" y1="182" x2="58" y2="182" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="18" y="172" font-size="11" fill="#333333">divisor</text>

  <!-- tick distribution bus -->
  <line x1="270" y1="152" x2="330" y2="152" stroke="#b5651d" stroke-width="2.4"/>
  <line x1="330" y1="152" x2="330" y2="480" stroke="#b5651d" stroke-width="2.4"/>
  <line x1="330" y1="200" x2="410" y2="200" stroke="#b5651d" stroke-width="2.4" marker-end="url(#arrowOrange)"/>
  <line x1="330" y1="480" x2="410" y2="480" stroke="#b5651d" stroke-width="2.4" marker-end="url(#arrowOrange)"/>
  <text x="300" y="144" text-anchor="middle" font-size="12" font-weight="bold" fill="#b5651d">tick</text>
  <text x="370" y="192" text-anchor="middle" font-size="11" fill="#b5651d">16 x baud</text>

  <!-- ===================== configuration ===================== -->
  <rect x="60" y="256" width="210" height="130" rx="6" fill="#f7f4ec" stroke="#8a7440" stroke-width="2"/>
  <text x="165" y="282" text-anchor="middle" font-size="14" font-weight="bold" fill="#5c4d26">configuration</text>
  <text x="165" y="306" text-anchor="middle" font-size="12" fill="#5c4d26">data_bits[3:0]   5..8</text>
  <text x="165" y="328" text-anchor="middle" font-size="12" fill="#5c4d26">parity_en, parity_odd</text>
  <text x="165" y="350" text-anchor="middle" font-size="12" fill="#5c4d26">stop2</text>
  <text x="165" y="372" text-anchor="middle" font-size="11" fill="#777777">latched per frame in TX</text>

  <path d="M 270 300 L 300 300 L 300 250 L 410 250" fill="none" stroke="#8a7440" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#arrowGold)"/>
  <path d="M 270 340 L 300 340 L 300 530 L 410 530" fill="none" stroke="#8a7440" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#arrowGold)"/>

  <!-- ===================== transmitter ===================== -->
  <rect x="410" y="100" width="420" height="200" rx="6" fill="#edf5ee" stroke="#2f6b3a" stroke-width="2"/>
  <text x="430" y="126" font-size="15" font-weight="bold" fill="#1d4527">uart_tx</text>

  <rect x="430" y="140" width="140" height="60" rx="4" fill="#ffffff" stroke="#2f6b3a" stroke-width="1.6"/>
  <text x="500" y="163" text-anchor="middle" font-size="12" fill="#1d4527">shift register</text>
  <text x="500" y="182" text-anchor="middle" font-size="11" fill="#666666">LSB first</text>

  <rect x="430" y="216" width="140" height="60" rx="4" fill="#ffffff" stroke="#2f6b3a" stroke-width="1.6"/>
  <text x="500" y="239" text-anchor="middle" font-size="12" fill="#1d4527">parity accum.</text>
  <text x="500" y="258" text-anchor="middle" font-size="11" fill="#666666">XOR of data bits</text>

  <rect x="600" y="140" width="212" height="136" rx="4" fill="#ffffff" stroke="#2f6b3a" stroke-width="1.6"/>
  <text x="706" y="163" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1d4527">frame FSM</text>
  <text x="706" y="186" text-anchor="middle" font-size="11.5" fill="#333333">IDLE - START - DATA</text>
  <text x="706" y="204" text-anchor="middle" font-size="11.5" fill="#333333">PARITY - STOP1 - STOP2</text>
  <text x="706" y="230" text-anchor="middle" font-size="11" fill="#666666">advances one bit</text>
  <text x="706" y="246" text-anchor="middle" font-size="11" fill="#666666">every 16 ticks</text>
  <text x="706" y="266" text-anchor="middle" font-size="11" fill="#666666">tx_start ignored while busy</text>

  <!-- tx inputs enter from the top -->
  <line x1="700" y1="74" x2="700" y2="98" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="700" y="68" text-anchor="middle" font-size="11.5" fill="#333333">tx_data[7:0]</text>
  <line x1="800" y1="74" x2="800" y2="98" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="800" y="68" text-anchor="middle" font-size="11.5" fill="#333333">tx_start</text>

  <line x1="830" y1="160" x2="890" y2="160" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="896" y="164" font-size="12" fill="#333333">tx_busy</text>
  <line x1="830" y1="196" x2="890" y2="196" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="896" y="200" font-size="12" fill="#333333">tx_done</text>
  <line x1="830" y1="232" x2="890" y2="232" stroke="#1d4527" stroke-width="2.6" marker-end="url(#arrow)"/>
  <text x="896" y="236" font-size="13" font-weight="bold" fill="#1d4527">tx</text>

  <!-- ===================== receiver ===================== -->
  <rect x="410" y="380" width="420" height="240" rx="6" fill="#eef0f8" stroke="#3b3f7a" stroke-width="2"/>
  <text x="430" y="406" font-size="15" font-weight="bold" fill="#272a58">uart_rx</text>

  <rect x="430" y="420" width="150" height="68" rx="4" fill="#ffffff" stroke="#3b3f7a" stroke-width="1.6"/>
  <text x="505" y="443" text-anchor="middle" font-size="12" font-weight="bold" fill="#272a58">2FF synchroniser</text>
  <text x="505" y="462" text-anchor="middle" font-size="11" fill="#666666">rx is async to clk</text>
  <text x="505" y="478" text-anchor="middle" font-size="11" fill="#666666">metastability guard</text>

  <rect x="430" y="506" width="150" height="68" rx="4" fill="#ffffff" stroke="#3b3f7a" stroke-width="1.6"/>
  <text x="505" y="529" text-anchor="middle" font-size="12" fill="#272a58">shift register</text>
  <text x="505" y="548" text-anchor="middle" font-size="11" fill="#666666">right-aligned by</text>
  <text x="505" y="564" text-anchor="middle" font-size="11" fill="#666666">8 - data_bits</text>

  <rect x="610" y="420" width="202" height="154" rx="4" fill="#ffffff" stroke="#3b3f7a" stroke-width="1.6"/>
  <text x="711" y="443" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#272a58">sampling FSM</text>
  <text x="711" y="466" text-anchor="middle" font-size="11.5" fill="#333333">IDLE - START - DATA</text>
  <text x="711" y="484" text-anchor="middle" font-size="11.5" fill="#333333">PARITY - STOP</text>
  <text x="711" y="510" text-anchor="middle" font-size="11" fill="#666666">wait 8 ticks, re-check</text>
  <text x="711" y="526" text-anchor="middle" font-size="11" fill="#666666">the line (rejects glitches)</text>
  <text x="711" y="548" text-anchor="middle" font-size="11" fill="#666666">then sample every</text>
  <text x="711" y="564" text-anchor="middle" font-size="11" fill="#666666">16 ticks</text>

  <line x1="360" y1="454" x2="408" y2="454" stroke="#272a58" stroke-width="2.6" marker-end="url(#arrow)"/>
  <text x="356" y="458" text-anchor="end" font-size="13" font-weight="bold" fill="#272a58">rx</text>
  <line x1="580" y1="454" x2="608" y2="454" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>

  <line x1="830" y1="440" x2="890" y2="440" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="896" y="444" font-size="12" fill="#333333">rx_data[7:0]</text>
  <line x1="830" y1="478" x2="890" y2="478" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="896" y="482" font-size="12" fill="#333333">rx_valid</text>
  <line x1="830" y1="516" x2="890" y2="516" stroke="#a03232" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="896" y="520" font-size="12" fill="#a03232">parity_err</text>
  <line x1="830" y1="554" x2="890" y2="554" stroke="#a03232" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="896" y="558" font-size="12" fill="#a03232">frame_err</text>

  <!-- loopback path -->
  <path d="M 918 232 L 980 232 L 980 340 L 360 340 L 360 452" fill="none" stroke="#aaaaaa" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="670" y="334" text-anchor="middle" font-size="11" fill="#888888">loopback used by the testbench: tx tied to rx</text>

  <!-- ===================== bottom legend band ===================== -->
  <line x1="60" y1="650" x2="960" y2="650" stroke="#dddddd" stroke-width="1.4"/>

  <text x="60" y="680" font-size="13" font-weight="bold" fill="#111111">frame format</text>
  <rect x="60" y="694" width="52" height="36" fill="#f3d9d9" stroke="#8a4b4b" stroke-width="1.4"/>
  <text x="86" y="717" text-anchor="middle" font-size="11" fill="#5c2f2f">start</text>
  <rect x="112" y="694" width="116" height="36" fill="#e2edf7" stroke="#33455c" stroke-width="1.4"/>
  <text x="170" y="712" text-anchor="middle" font-size="11" fill="#1b2a3a">data 5-8</text>
  <text x="170" y="726" text-anchor="middle" font-size="10" fill="#555555">LSB first</text>
  <rect x="228" y="694" width="54" height="36" fill="#f7f0d9" stroke="#8a7440" stroke-width="1.4"/>
  <text x="255" y="717" text-anchor="middle" font-size="10.5" fill="#5c4d26">parity</text>
  <rect x="282" y="694" width="70" height="36" fill="#ddeede" stroke="#2f6b3a" stroke-width="1.4"/>
  <text x="317" y="717" text-anchor="middle" font-size="11" fill="#1d4527">stop 1-2</text>
  <text x="60" y="752" font-size="10.5" fill="#777777">parity present only when parity_en, second stop bit only when stop2</text>

  <text x="560" y="680" font-size="13" font-weight="bold" fill="#111111">16x oversampling</text>
  <text x="560" y="698" font-size="10.5" fill="#777777">16 ticks per bit time</text>
  <line x1="560" y1="716" x2="880" y2="716" stroke="#cccccc" stroke-width="1.2"/>
  <g stroke="#bbbbbb" stroke-width="1">
    <line x1="560" y1="710" x2="560" y2="722"/><line x1="580" y1="710" x2="580" y2="722"/>
    <line x1="600" y1="710" x2="600" y2="722"/><line x1="620" y1="710" x2="620" y2="722"/>
    <line x1="640" y1="710" x2="640" y2="722"/><line x1="660" y1="710" x2="660" y2="722"/>
    <line x1="680" y1="710" x2="680" y2="722"/><line x1="720" y1="710" x2="720" y2="722"/>
    <line x1="740" y1="710" x2="740" y2="722"/><line x1="760" y1="710" x2="760" y2="722"/>
    <line x1="780" y1="710" x2="780" y2="722"/><line x1="800" y1="710" x2="800" y2="722"/>
    <line x1="820" y1="710" x2="820" y2="722"/><line x1="840" y1="710" x2="840" y2="722"/>
    <line x1="860" y1="710" x2="860" y2="722"/><line x1="880" y1="710" x2="880" y2="722"/>
  </g>
  <circle cx="700" cy="716" r="5.5" fill="#a03232"/>
  <text x="700" y="744" text-anchor="middle" font-size="11" fill="#a03232">sample at tick 8, middle of the bit</text>
</svg>
